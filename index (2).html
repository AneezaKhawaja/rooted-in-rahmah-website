<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You | Sourdough Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F9F6F1;
    --terracotta:#C77F5C;
    --brown:#8B4513;
    --ink:#2B2420;
    --line:#E4DAD1;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--cream);color:var(--ink);
    font-family:'Montserrat',sans-serif;
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:32px;text-align:center;
  }
  .logo-mark{height:110px;width:auto;margin-bottom:24px;}
  h1{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:2.4rem;margin-bottom:14px;}
  p{max-width:46ch;color:#4a423c;margin-bottom:34px;line-height:1.6;}
  .actions{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;}
  .btn{
    display:inline-block;background:var(--brown);color:var(--cream);
    padding:13px 28px;font-size:0.85rem;letter-spacing:0.02em;
    border:none;text-decoration:none;transition:background .2s;
  }
  .btn:hover{background:var(--terracotta);}
  .btn-ghost{
    display:inline-block;border:1px solid var(--brown);color:var(--brown);
    padding:12px 27px;font-size:0.85rem;text-decoration:none;
  }
  footer{margin-top:56px;font-size:0.8rem;color:#8a8078;}
</style>
</head>
<body>
  <img class="logo-mark" src="../../images/sourdough-studio-logo.png" alt="Sourdough Studio, Rooted in Rahmah">
  <h1>Thank you!</h1>
  <p>Your message came through. I'll personally confirm the details by email before anything is locked in.</p>
  <div class="actions">
    <a href="/sourdough-studio/" class="btn">Back to Sourdough Studio</a>
    <a href="/" class="btn-ghost">Rooted in Rahmah home</a>
  </div>
  <footer>Ellicott City, Maryland</footer>
</body>
</html>
