<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Received — Sourdough Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #F9F6F1; --terracotta: #C77F5C; --warm-brown: #8B4513;
    --panel: #EFE3D3; --ink: #33261C;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--cream); color: var(--ink);
    font-family: 'Montserrat', sans-serif; line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, .serif { font-family: 'Cormorant Garamond', serif; font-weight: 500; }
  a { color: inherit; }
  nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 28px 32px; max-width: 1000px; margin: 0 auto;
  }
  .nav-mark { font-family: 'Cormorant Garamond', serif; font-size: 1.05rem; color: var(--terracotta); text-decoration: none; }

  .confirm {
    max-width: 520px; margin: 90px auto; padding: 0 32px; text-align: center;
  }
  .checkmark {
    width: 56px; height: 56px; margin: 0 auto 30px; border-radius: 50%;
    background: var(--panel); display: flex; align-items: center; justify-content: center;
  }
  .checkmark svg { width: 24px; height: 24px; }
  h1 { font-size: 2.1rem; color: var(--warm-brown); margin-bottom: 18px; }
  .confirm p { font-size: 1rem; opacity: 0.85; }
  .confirm p + p { margin-top: 14px; }
  .details {
    margin-top: 34px; padding: 24px; background: var(--panel); text-align: left; font-size: 0.88rem;
  }
  .details div + div { margin-top: 8px; }
  .details strong { display: inline-block; min-width: 90px; opacity: 0.6; font-weight: 500; }
  .back {
    display: inline-block; margin-top: 40px; font-size: 0.85rem;
    text-decoration: underline; color: var(--warm-brown);
  }
  footer {
    background: var(--ink); color: var(--cream);
    padding: 40px 32px; text-align: center; font-size: 0.8rem; opacity: 0.7; margin-top: 60px;
  }
  footer a { text-decoration: none; color: var(--cream); }
</style>
</head>
<body>

<nav>
  <a class="nav-mark" href="index.html">Rooted in Rahmah</a>
</nav>

<section class="confirm">
  <div class="checkmark">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M4 12.5L9.5 18L20 6" stroke="#8B4513" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <h1>Thank you for reserving!</h1>
  <p>Your order has been submitted. I'll personally review it and reach out soon with a confirmation, along with pickup and payment details.</p>

  <div class="details">
    <div><strong>Pickup</strong> Sunday, Ellicott City</div>
    <div><strong>Orders close</strong> Friday</div>
  </div>

  <a class="back" href="sourdough-studio.html">Back to Sourdough Studio</a>
</section>

<footer>
  <a href="index.html">Rooted in Rahmah</a> · © 2026
</footer>

</body>
</html>
