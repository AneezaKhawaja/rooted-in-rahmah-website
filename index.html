<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rooted in Rahmah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F9F6F1;
    --terracotta:#C77F5C;
    --brown:#8B4513;
    --rose:#A9556F;
    --ink:#2B2420;
    --line:#E4DAD1;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--cream);color:var(--ink);
    font-family:'Montserrat',sans-serif;
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:32px;
    text-align:center;
  }
  h1{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:2.6rem;margin-bottom:6px;}
  .logo-mark{height:150px;width:auto;margin-bottom:6px;}
  .tagline{font-style:italic;font-family:'Cormorant Garamond',serif;font-size:1.15rem;color:#4a423c;margin-bottom:56px;}
  .doors{display:flex;gap:24px;flex-wrap:wrap;justify-content:center;max-width:760px;}
  .door{
    flex:1;min-width:260px;background:#fff;border:1px solid var(--line);
    padding:40px 30px;text-align:left;text-decoration:none;color:inherit;
    transition:transform .15s, box-shadow .15s;
  }
  .door:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(43,36,32,0.08);}
  .door.sourdough{border-top:3px solid var(--brown);}
  .door.career{border-top:3px solid var(--rose);}
  .door h2{font-size:1.6rem;margin-bottom:10px;}
  .door p{font-size:0.92rem;color:#4a423c;margin-bottom:18px;}
  .door .go{font-size:0.82rem;font-weight:600;}
  .door.sourdough .go{color:var(--brown);}
  .door.career .go{color:var(--rose);}
  footer{margin-top:56px;font-size:0.8rem;color:#8a8078;}
</style>
</head>
<body>
  <img class="logo-mark" src="images/rooted-in-rahmah-logo.png" alt="Rooted in Rahmah">
  <p class="tagline">Compassion, in practice.</p>

  <div class="doors">
    <a class="door sourdough" href="sourdough-studio.html">
      <h2>Sourdough Studio</h2>
      <p>Slow-fermented sourdough, baked in small batches out of my kitchen.</p>
      <div class="go">Visit Sourdough Studio →</div>
    </a>
    <a class="door career" href="career-compass.html">
      <h2>Career Compass</h2>
      <p>Guidance for the pivotal moments in your career.</p>
      <div class="go">Visit Career Compass →</div>
    </a>
  </div>

  <footer>Ellicott City, Maryland</footer>
</body>
</html>
